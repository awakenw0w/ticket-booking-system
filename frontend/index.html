<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бронирование билетов</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Ticket Booking System</p>
        <h1>Бронирование билетов</h1>
      </div>
      <div class="topbar__actions">
        <span id="apiStatus" class="status status--idle">API не проверен</span>
        <button id="refreshButton" class="button button--primary" type="button">Обновить</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel--events" aria-labelledby="eventsTitle">
        <div class="panel__header">
          <div>
            <p class="eyebrow">Мероприятия</p>
            <h2 id="eventsTitle">Список</h2>
          </div>
          <span id="eventsCount" class="counter">0</span>
        </div>

        <div id="eventsList" class="event-list" aria-live="polite"></div>

        <form id="eventForm" class="form form--stacked">
          <h3>Новое мероприятие</h3>
          <label>
            Название
            <input name="title" type="text" required maxlength="255" />
          </label>
          <label>
            Место
            <input name="location" type="text" required maxlength="255" />
          </label>
          <label>
            Дата и время
            <input name="starts_at" type="datetime-local" required />
          </label>
          <label>
            Статус
            <select name="status">
              <option value="draft">Черновик</option>
              <option value="published" selected>Опубликовано</option>
              <option value="finished">Завершено</option>
              <option value="cancelled">Отменено</option>
            </select>
          </label>
          <label>
            Описание
            <textarea name="description" rows="3"></textarea>
          </label>
          <button class="button button--primary" type="submit">Создать</button>
        </form>
      </section>

      <section class="main-column">
        <section class="panel" aria-labelledby="eventDetailsTitle">
          <div class="panel__header">
            <div>
              <p class="eyebrow">Выбранное мероприятие</p>
              <h2 id="eventDetailsTitle">Детали</h2>
            </div>
            <span id="eventStatus" class="status status--idle">Нет выбора</span>
          </div>
          <div id="eventDetails" class="details-empty">Выберите мероприятие из списка.</div>
        </section>

        <section class="panel" aria-labelledby="categoriesTitle">
          <div class="panel__header">
            <div>
              <p class="eyebrow">Билеты</p>
              <h2 id="categoriesTitle">Категории</h2>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Категория</th>
                  <th>Цена</th>
                  <th>Всего</th>
                  <th>Доступно</th>
                </tr>
              </thead>
              <tbody id="categoriesTable"></tbody>
            </table>
          </div>

          <form id="categoryForm" class="form form--inline">
            <label>
              Категория
              <input name="name" type="text" required maxlength="255" />
            </label>
            <label>
              Цена
              <input name="price" type="number" min="0" step="0.01" required />
            </label>
            <label>
              Количество
              <input name="quantity" type="number" min="1" step="1" required />
            </label>
            <button class="button" type="submit">Добавить</button>
          </form>
        </section>

        <section class="panel" aria-labelledby="bookingTitle">
          <div class="panel__header">
            <div>
              <p class="eyebrow">Бронирование</p>
              <h2 id="bookingTitle">Заявка клиента</h2>
            </div>
          </div>

          <form id="bookingForm" class="form form--grid">
            <label>
              Категория
              <select name="ticket_category_id" required></select>
            </label>
            <label>
              Количество
              <input name="quantity" type="number" min="1" step="1" value="1" required />
            </label>
            <label>
              Имя клиента
              <input name="customer_name" type="text" required maxlength="255" />
            </label>
            <label>
              Почта
              <input name="customer_email" type="email" required maxlength="255" />
            </label>
            <label>
              Телефон
              <input name="customer_phone" type="tel" required maxlength="50" />
            </label>
            <button class="button button--primary" type="submit">Забронировать</button>
          </form>
        </section>

        <section class="panel" aria-labelledby="bookingsTitle">
          <div class="panel__header">
            <div>
              <p class="eyebrow">Журнал</p>
              <h2 id="bookingsTitle">Бронирования</h2>
            </div>
            <button id="loadBookingsButton" class="button" type="button">Показать все</button>
          </div>
          <div id="bookingsList" class="booking-list" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
